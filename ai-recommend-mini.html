<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rekomendasi Outfit — IndoConcert</title>
  <link rel="stylesheet" href="css/shared.css"/>
  <style>
    body { background:linear-gradient(175deg,rgba(112,140,255,.06) 0%,#fff 50%); min-height:100vh; }
    .backdrop { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40; }
    .modal-outer { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:flex-end; padding:40px; }

    .recommend-popup {
      background:#fff; border-radius:20px;
      box-shadow:0 0 20px rgba(0,0,0,.15);
      width:460px; padding:24px;
      position:relative; animation:slideUp .3s ease;
    }
    @keyframes slideUp { from{transform:translateY(16px);opacity:0} to{transform:translateY(0);opacity:1} }
    .popup-close { position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px; cursor:pointer; color:#555; }
    .popup-title { font-size:20px; font-weight:700; color:#000; margin-bottom:8px; }
    .popup-subtitle { font-size:15px; color:#333; margin-bottom:6px; }

    .color-row { display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:15px; color:#333; }
    .color-dot { width:18px; height:18px; border-radius:50%; display:inline-block; }

    .outfit-label { font-size:14px; font-weight:600; color:#333; margin-bottom:10px; }
    .outfit-images { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
    .outfit-img-wrap {
      position:relative; border-radius:12px; overflow:hidden;
      height:130px; cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.15);
    }
    .outfit-img-wrap img { width:100%; height:100%; object-fit:cover; transition:transform .25s; }
    .outfit-img-wrap:hover img { transform:scale(1.04); }
    .save-btn {
      position:absolute; bottom:6px; right:8px;
      background:rgba(255,255,255,.9); border:none; border-radius:6px;
      padding:3px 8px; font-size:12px; cursor:pointer; color:#37457d; font-weight:600;
    }

    .popup-actions { display:flex; gap:10px; }
    .btn-detail {
      background:#37457d; color:#fff; border:none; border-radius:12px;
      padding:12px 24px; font-size:16px; font-weight:700;
      cursor:pointer; font-family:'Inter',sans-serif; text-decoration:none; display:inline-block;
    }
    .btn-chat {
      background:#f1f3ff; color:#37457d; border:none; border-radius:12px;
      padding:12px 20px; font-size:15px; font-weight:600;
      cursor:pointer; font-family:'Inter',sans-serif; text-decoration:none; display:inline-block;
    }
    .popup-arrow { width:0; height:0; border-left:14px solid transparent; border-right:14px solid transparent; border-top:18px solid #fff; position:absolute; bottom:-18px; left:40px; filter:drop-shadow(0 3px 2px rgba(0,0,0,.1)); }
  </style>
</head>
<body>
<div class="backdrop" onclick="window.location='profile.html#tickets'"></div>

<!-- Dimmed bg -->
<div style="filter:blur(2px);opacity:.5;pointer-events:none;position:fixed;inset:0;overflow:hidden;padding:40px 80px;">
  <div style="font-size:42px;font-weight:700;color:#000;margin-top:150px;">Tiket Saya</div>
</div>

<div class="modal-outer">
  <div class="recommend-popup">
    <button class="popup-close" onclick="window.location='profile.html#tickets'">✕</button>
    <div class="popup-title">Rekomendasi Otomatis</div>
    <div class="popup-subtitle">Cuacanya cerah! Jadi, jangan lupa pakai sunscreen!</div>

    <div class="color-row">
      Warna :&nbsp;
      <span class="color-dot" style="background:#c9b1d9;"></span> Lavender,&nbsp;
      <span class="color-dot" style="background:#1a237e;"></span> Biru Tua
    </div>

    <div class="outfit-label">Inspirasi:</div>
    <div class="outfit-images">
      <div class="outfit-img-wrap">
        <img src="https://www.figma.com/api/mcp/asset/4854ac33-3c27-4a13-8e51-19fbb0e9f422" alt="Outfit 1"/>
        <button class="save-btn" onclick="saveOutfit(1)">🔖</button>
      </div>
      <div class="outfit-img-wrap">
        <img src="https://www.figma.com/api/mcp/asset/75a62d07-a9ff-48ed-ac54-b2e949976a6f" alt="Outfit 2"/>
        <button class="save-btn" onclick="saveOutfit(2)">🔖</button>
      </div>
    </div>

    <div class="popup-actions">
      <a href="ai-recommendation.html" class="btn-detail">Lihat Detail</a>
      <a href="ai-chatbot.html" class="btn-chat">🤖 Tanya AI Stylis</a>
    </div>
    <div class="popup-arrow"></div>
  </div>
</div>

<script>
function saveOutfit(n) { alert('Outfit ' + n + ' disimpan ke wishlist!'); }
</script>
</body>
</html>
