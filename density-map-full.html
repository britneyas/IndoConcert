<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Peta Kepadatan Penuh — IndoConcert</title>
  <link rel="stylesheet" href="css/shared.css"/>
  <style>
    body { background:linear-gradient(175deg,rgba(112,140,255,.06) 0%,#fff 50%); min-height:100vh; }
    .backdrop { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40; }
    .modal-outer { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:30px; }
    .density-modal {
      background:#fff; border-radius:20px;
      box-shadow:0 0 20px rgba(0,0,0,.15);
      width:min(1108px,96vw); max-height:90vh;
      overflow:hidden; position:relative;
    }
    .modal-header { padding:20px 28px 0; display:flex; align-items:center; justify-content:space-between; }
    .modal-title { font-size:22px; font-weight:700; color:#000; }
    .modal-close { width:30px; height:30px; cursor:pointer; background:none; border:none; font-size:22px; color:#555; }
    .map-large { width:100%; height:560px; overflow:hidden; position:relative; }
    .map-large img { width:100%; height:100%; object-fit:cover; }
    .map-controls {
      position:absolute; bottom:16px; right:16px;
      display:flex; gap:8px;
    }
    .map-ctrl-btn {
      background:rgba(255,255,255,.9); border:1px solid #ddd;
      border-radius:8px; padding:6px 12px; cursor:pointer;
      font-size:13px; font-weight:600; color:#333;
      box-shadow:0 2px 6px rgba(0,0,0,.15); text-decoration:none;
    }
    .modal-footer { padding:16px 28px; display:flex; align-items:center; justify-content:space-between; }
    .density-stats { font-size:16px; color:#000; line-height:1.7; }
    .density-legend { display:flex; gap:16px; }
    .legend-item { display:flex; align-items:center; gap:6px; font-size:13px; color:#555; }
    .legend-color { width:20px; height:20px; border-radius:4px; }
    .back-btn {
      background:none; border:none; font-size:16px; color:var(--primary);
      cursor:pointer; font-family:'Inter',sans-serif; font-weight:500;
      text-decoration:underline; padding:0;
    }
  </style>
</head>
<body>
<div class="backdrop" onclick="window.location='density-map-mini.html'"></div>

<div class="modal-outer">
  <div class="density-modal">
    <div class="modal-header">
      <div class="modal-title">Live Kepadatan Manusia — Nadin Amizah</div>
      <button class="modal-close" onclick="window.location='density-map-mini.html'">✕</button>
    </div>

    <!-- Legend -->
    <div style="padding:10px 28px; display:flex; gap:16px; flex-wrap:wrap;">
      <div class="legend-item"><div class="legend-color" style="background:rgba(255,0,0,.6);"></div>Sangat Padat (&gt;80%)</div>
      <div class="legend-item"><div class="legend-color" style="background:rgba(255,165,0,.6);"></div>Padat (60–80%)</div>
      <div class="legend-item"><div class="legend-color" style="background:rgba(255,255,0,.6);"></div>Sedang (40–60%)</div>
      <div class="legend-item"><div class="legend-color" style="background:rgba(0,255,0,.4);"></div>Jarang (&lt;40%)</div>
    </div>

    <div class="map-large">
      <img src="https://www.figma.com/api/mcp/asset/76ca2069-418a-45fc-b59b-ee070a83b4fd" alt="Full Density Map"/>
      <div class="map-controls">
        <button class="map-ctrl-btn" onclick="zoomIn()">＋ Zoom In</button>
        <button class="map-ctrl-btn" onclick="zoomOut()">－ Zoom Out</button>
        <a href="density-map-mini.html" class="map-ctrl-btn">⛶ Perkecil</a>
      </div>
    </div>

    <div class="modal-footer">
      <div class="density-stats">
        Rata-rata Kepadatan: <b>Tinggi</b> (78%) &nbsp;|&nbsp;
        Saran: <b>Datang sebelum 18:00</b>
      </div>
      <div style="display:flex;gap:12px;align-items:center;">
        <span style="font-size:13px;color:#9ca3af;">Update: Real-time</span>
        <button class="back-btn" onclick="window.location='density-map-mini.html'">← Kembali</button>
      </div>
    </div>
  </div>
</div>

<script>
let zoom = 1;
function zoomIn() { zoom = Math.min(zoom+.2, 2.5); document.querySelector('.map-large img').style.transform = `scale(${zoom})`; }
function zoomOut() { zoom = Math.max(zoom-.2, .8); document.querySelector('.map-large img').style.transform = `scale(${zoom})`; }
</script>
</body>
</html>
